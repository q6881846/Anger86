version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: ../docker/backend.Dockerfile
    container_name: mowen-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - PROMPT_PORT=3456
      - PROMPT_SERVICE_KEY=${PROMPT_SERVICE_KEY:-change-me-in-production}
    ports:
      - "127.0.0.1:3456:3456"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "--header",
          "X-API-Key: ${PROMPT_SERVICE_KEY:-change-me-in-production}",
          "http://localhost:3456/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mowen-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        - VITE_PROMPT_SERVICE_KEY=${PROMPT_SERVICE_KEY:-change-me-in-production}
    container_name: mowen-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mowen-net

networks:
  mowen-net:
    driver: bridge
